name: Setup project
description: Setup Node.js, pnpm (from packageManager), install dependencies and build

inputs:
  node-version:
    description: Node.js version
    required: false
    default: '22'
  registry-url:
    description: NPM registry URL (optional, for publish workflows)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v4

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash

    - name: Build
      run: pnpm build
      shell: bash
